<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applications — Start With Kunmi</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F3FB;
  --surface:#FFFFFF;
  --dark:#1C1038;
  --ink:#0F0F0F;
  --muted:#6E6660;
  --accent:#4A0D8F;
  --accent-deep:#35066B;
  --accent-light:#7B4BC9;
  --pink:#F500E0;
  --green:#0F8A4C;
  --amber:#B8791F;
  --red:#B7291F;
  --whatsapp:#25D366;
  --border:#E8E4DC;
  --border-soft:#F0EBF5;
  --radius:15px;
  --font-display:'Bricolage Grotesque','Archivo',system-ui,sans-serif;
  --font-body:'Archivo',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --shadow-card:0 2px 4px rgba(28,16,56,.03), 0 12px 28px -18px rgba(28,16,56,.16);
  --shadow-hover:0 4px 8px rgba(28,16,56,.04), 0 20px 40px -18px rgba(74,13,143,.28);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--font-body);line-height:1.55;
  -webkit-font-smoothing:antialiased;min-height:100vh;
}
img,svg{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--pink);color:#fff}
.icon{
  width:1.1rem;height:1.1rem;flex:0 0 auto;
  fill:none;stroke:currentColor;stroke-width:2.25;
  stroke-linecap:round;stroke-linejoin:round;
}

/* ============ LOGIN GATE ============ */
.gate{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  background:var(--dark);padding:2rem;overflow:hidden;
}
.gate::before,.gate::after{
  content:'';position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none;
}
.gate::before{
  width:60vw;height:60vw;max-width:800px;max-height:800px;
  left:-15vw;top:-15vw;
  background:radial-gradient(circle,rgba(123,75,201,.5) 0%,rgba(74,13,143,0) 70%);
}
.gate::after{
  width:40vw;height:40vw;max-width:600px;max-height:600px;
  right:-10vw;bottom:-10vw;
  background:radial-gradient(circle,rgba(245,0,224,.22) 0%,rgba(245,0,224,0) 70%);
}
.gate-card{
  position:relative;z-index:2;width:100%;max-width:440px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:var(--radius);padding:3rem 2.5rem 2.5rem;
  box-shadow:0 40px 80px -40px rgba(0,0,0,.6);
}
.gate-brand{
  font-family:var(--font-display);font-size:1.15rem;font-weight:700;
  letter-spacing:-.02em;color:#fff;margin-bottom:2.5rem;
}
.gate-brand em{font-style:italic;color:var(--accent-light)}
.gate h1{
  font-family:var(--font-display);font-size:clamp(1.6rem,4vw,2rem);
  font-weight:800;letter-spacing:-.02em;line-height:1.1;color:#fff;margin-bottom:.65rem;
}
.gate h1 em{font-style:italic;font-weight:400;color:var(--accent-light)}
.gate-hint{font-size:.95rem;color:rgba(255,255,255,.62);margin-bottom:2rem;line-height:1.6}
.gate-field{position:relative;margin-bottom:1rem}
.gate-field input{
  width:100%;padding:1rem 1.15rem;
  font-family:var(--font-body);font-size:1rem;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.16);
  border-radius:12px;color:#fff;
  transition:border-color .25s, background-color .25s;
}
.gate-field input::placeholder{color:rgba(255,255,255,.35)}
.gate-field input:focus{outline:none;border-color:var(--pink);background:rgba(255,255,255,.08)}
.gate-submit{
  width:100%;padding:1rem 1.25rem;
  background:var(--accent);color:#fff;border-radius:12px;
  font-family:var(--font-body);font-size:.78rem;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;
  transition:background-color .25s, transform .15s;
  display:flex;align-items:center;justify-content:center;gap:.7rem;
}
.gate-submit:hover{background:var(--accent-deep)}
.gate-submit:active{transform:scale(.985)}
.gate-submit:disabled{opacity:.55;cursor:not-allowed}
.gate-error{margin-top:1rem;font-size:.88rem;color:#FF6EC7;min-height:1.2em;font-weight:500}
.gate-foot{
  margin-top:2rem;font-family:var(--font-mono);
  font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.35);
}

/* ============ DASHBOARD ============ */
.dash{display:none;padding:0 0 5rem}
.dash.is-visible{display:block}

.dash-top{
  background:var(--dark);color:#fff;padding:1.5rem 5vw;
  display:flex;align-items:center;justify-content:space-between;
  gap:1.5rem;flex-wrap:wrap;
}
.dash-top-brand{
  font-family:var(--font-display);font-size:1rem;font-weight:700;letter-spacing:-.02em;
}
.dash-top-brand em{font-style:italic;color:var(--accent-light)}
.dash-top-meta{
  display:flex;align-items:center;gap:1.25rem;
  font-family:var(--font-mono);font-size:.68rem;
  letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);
}
.live-dot{
  display:inline-block;width:.55rem;height:.55rem;border-radius:50%;
  background:var(--pink);margin-right:.5rem;
  animation:pulse 2s infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.5;transform:scale(1.4)}
}
.dash-top-actions{display:flex;gap:.5rem;flex-wrap:wrap}
.dash-top-actions button, .dash-top-actions a{
  padding:.6rem 1.1rem;border:1px solid rgba(255,255,255,.16);
  border-radius:10px;color:rgba(255,255,255,.75);
  font-family:var(--font-mono);font-size:.66rem;
  letter-spacing:.14em;text-transform:uppercase;
  transition:border-color .25s, color .25s, background-color .25s;
  display:inline-flex;align-items:center;gap:.5rem;
}
.dash-top-actions button:hover, .dash-top-actions a:hover{border-color:var(--pink);color:#fff}
.dash-top-actions .export-btn{border-color:rgba(245,0,224,.4);color:#FFB8F0}

.dash-inner{max-width:1400px;margin-inline:auto;padding:3rem 5vw 0}

.stat-hero{display:flex;align-items:flex-end;gap:1.5rem;flex-wrap:wrap;margin-bottom:2.5rem}
.stat-num{
  font-family:var(--font-display);font-size:clamp(4rem,10vw,8rem);
  font-weight:800;letter-spacing:-.055em;line-height:.85;color:var(--accent);
}
.stat-label{padding-bottom:1rem}
.stat-label strong{
  display:block;font-family:var(--font-display);font-size:1.1rem;font-weight:700;
  letter-spacing:-.01em;color:var(--ink);text-transform:uppercase;
}
.stat-label span{
  font-family:var(--font-mono);font-size:.7rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
}
.stat-label .new-badge{
  display:inline-block;margin-left:.6rem;padding:.15rem .55rem;
  background:var(--pink);color:#fff;border-radius:999px;
  font-size:.6rem;letter-spacing:.1em;
}

/* Controls */
.controls{
  display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;
  margin-bottom:2rem;padding:1rem;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow-card);
}
.search-wrap{position:relative;flex:1 1 240px;min-width:0}
.search-wrap .icon{
  position:absolute;left:1rem;top:50%;transform:translateY(-50%);
  color:var(--muted);pointer-events:none;width:1rem;height:1rem;
}
.search-input{
  width:100%;padding:.75rem 1rem .75rem 2.75rem;
  border:1px solid var(--border);border-radius:10px;
  background:var(--bg);font-size:.92rem;
  transition:border-color .25s, background-color .25s;
}
.search-input:focus{outline:none;border-color:var(--accent);background:var(--surface)}

.view-toggle{
  display:inline-flex;background:var(--bg);
  border:1px solid var(--border);border-radius:10px;padding:.2rem;
}
.view-toggle button{
  padding:.5rem .9rem;border-radius:8px;
  font-family:var(--font-mono);font-size:.66rem;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);transition:background-color .2s, color .2s;
  display:inline-flex;align-items:center;gap:.4rem;
}
.view-toggle button.is-active{background:var(--accent);color:#fff}
.view-toggle button:hover:not(.is-active){color:var(--ink)}

.filter-pills{display:flex;gap:.4rem;flex-wrap:wrap}
.pill{
  padding:.55rem 1rem;border-radius:999px;
  border:1px solid var(--border);background:var(--surface);
  font-family:var(--font-body);font-size:.78rem;font-weight:600;
  letter-spacing:.02em;color:var(--muted);
  transition:all .2s;display:inline-flex;align-items:center;gap:.5rem;
}
.pill:hover{border-color:var(--accent-light);color:var(--ink)}
.pill.is-active{background:var(--accent);border-color:var(--accent);color:#fff}
.pill .count{
  display:inline-block;min-width:1.4rem;padding:.05rem .4rem;
  background:rgba(0,0,0,.08);border-radius:999px;
  font-family:var(--font-mono);font-size:.62rem;font-weight:600;
  text-align:center;
}
.pill.is-active .count{background:rgba(255,255,255,.2)}

/* ============ CARDS VIEW ============ */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));
  gap:1.25rem;
}
@media(min-width:1200px){.grid{grid-template-columns:repeat(3, 1fr)}}
@media(min-width:900px) and (max-width:1199px){.grid{grid-template-columns:repeat(2, 1fr)}}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:1.5rem 1.35rem 1.35rem;
  box-shadow:var(--shadow-card);
  transition:box-shadow .3s, border-color .25s, opacity .25s, transform .35s cubic-bezier(.25,.46,.45,.94);
  display:flex;flex-direction:column;gap:1rem;
  position:relative;overflow:hidden;
}
.card:hover{box-shadow:var(--shadow-hover);border-color:var(--accent-light)}
.card.is-accepted{border-left:3px solid var(--green)}
.card.is-maybe{border-left:3px solid var(--amber)}
.card.is-rejected{border-left:3px solid var(--red)}
.card.is-rejected .card-head,
.card.is-rejected .tag-row,
.card.is-rejected .card-answers{opacity:.55}

.card.is-removing{
  transform:translateY(-6px) scale(.97);
  opacity:0;
  pointer-events:none;
}

.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.card-name-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.card-name{
  font-family:var(--font-display);font-size:1.15rem;font-weight:700;
  letter-spacing:-.015em;line-height:1.2;color:var(--ink);word-break:break-word;
}
.new-badge{
  display:none;padding:.12rem .45rem;border-radius:999px;
  background:var(--pink);color:#fff;
  font-size:.64rem;font-weight:700;letter-spacing:.04em;
}
.card.is-unseen .new-badge{display:inline-block}
.card-date{
  font-family:var(--font-mono);font-size:.62rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);white-space:nowrap;padding-top:.2rem;
}
.dup-badge{
  display:inline-block;margin-top:.3rem;padding:.15rem .5rem;
  background:rgba(245,0,224,.1);color:var(--pink);border-radius:6px;
  font-family:var(--font-mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
}

.tag-row{display:flex;flex-wrap:wrap;gap:.35rem}
.tag{
  font-family:var(--font-mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;
  padding:.3rem .6rem;border-radius:6px;
  background:var(--bg);color:var(--muted);border:1px solid var(--border-soft);
}
.tag.accent{background:rgba(74,13,143,.06);color:var(--accent);border-color:rgba(74,13,143,.14)}

.card-answers{
  display:flex;flex-direction:column;gap:.9rem;
  padding-top:1rem;border-top:1px solid var(--border-soft);
}
.qa{display:flex;flex-direction:column;gap:.3rem}
.qa-label{
  font-family:var(--font-mono);font-size:.6rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);
  display:flex;justify-content:space-between;align-items:center;
}
.qa-words{color:var(--muted);font-size:.58rem;letter-spacing:.1em}
.qa-words.is-short{color:var(--amber)}
.qa-body{font-size:.88rem;line-height:1.6;color:var(--ink);word-break:break-word;white-space:pre-wrap}
.qa-body.clamped{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.qa-toggle{
  align-self:flex-start;font-family:var(--font-mono);font-size:.62rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent);padding:.2rem 0;
  background:none;border:0;border-bottom:1px solid transparent;transition:border-color .2s;
}
.qa-toggle:hover{border-bottom-color:var(--accent)}

.status-note{
  display:none;align-items:center;justify-content:space-between;gap:.75rem;
  padding:.55rem .75rem;border-radius:10px;font-size:.8rem;font-weight:600;
}
.card.is-accepted .status-note{display:flex;background:rgba(15,138,76,.08);color:var(--green)}
.card.is-rejected .status-note{display:flex;background:rgba(183,41,31,.07);color:var(--red)}
.note-undo{
  background:none;border:0;color:inherit;font-size:.8rem;font-weight:700;
  text-decoration:underline;text-underline-offset:3px;padding:.5rem .25rem;
}

.secondary-row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.ghost{
  min-height:44px;border-radius:10px;
  border:1px solid var(--border);background:transparent;
  font-size:.8rem;font-weight:600;color:var(--muted);
  transition:background-color .2s, color .2s, border-color .2s;
}
.ghost:hover{border-color:var(--accent-light);color:var(--ink)}
.ghost.is-on-maybe{background:var(--amber);border-color:var(--amber);color:#fff}
.ghost.is-on-rejected{background:var(--red);border-color:var(--red);color:#fff}

.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.cta{
  min-height:50px;padding:.7rem .75rem;border-radius:12px;
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  font-size:.82rem;font-weight:700;letter-spacing:.01em;text-decoration:none;text-align:center;
  border:1px solid transparent;transition:background-color .2s, border-color .2s, color .2s;
}
.cta-wa{background:var(--whatsapp);color:#0B3B1E;border-color:var(--whatsapp)}
.cta-wa:hover{background:#1eaa52;border-color:#1eaa52;color:#fff}
.cta-mail{background:var(--accent);color:#fff;border-color:var(--accent)}
.cta-mail:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.cta-decline{display:none;grid-column:1 / -1;background:var(--surface);color:var(--red);border-color:rgba(183,41,31,.35)}
.cta-decline:hover{background:rgba(183,41,31,.06)}
.card.is-rejected .cta-wa,
.card.is-rejected .cta-mail{display:none}
.card.is-rejected .cta-decline{display:inline-flex}

/* ============ TABLE VIEW ============ */
.table-wrap{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-card);
  overflow:hidden;
}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.leads{
  width:100%;border-collapse:collapse;font-size:.88rem;
  min-width:900px;
}
table.leads thead{
  position:sticky;top:0;z-index:2;
}
table.leads th{
  background:var(--dark);color:#fff;
  font-family:var(--font-mono);font-size:.66rem;
  letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  padding:.9rem 1rem;text-align:left;white-space:nowrap;
  cursor:pointer;user-select:none;
  transition:background-color .2s;
}
table.leads th:hover{background:#2a1a55}
table.leads th .sort-arrow{
  display:inline-block;margin-left:.4rem;opacity:.35;
  transition:opacity .2s;
}
table.leads th.is-sorted .sort-arrow{opacity:1;color:var(--pink)}
table.leads td{
  padding:.85rem 1rem;border-bottom:1px solid var(--border-soft);
  vertical-align:middle;color:var(--ink);
}
table.leads tr:last-child td{border-bottom:0}
table.leads tbody tr{
  transition:background-color .2s;
  cursor:default;
}
table.leads tbody tr:hover{background:rgba(74,13,143,.04)}

/* row status colors */
table.leads tbody tr.row-accepted{background:rgba(15,138,76,.05)}
table.leads tbody tr.row-maybe{background:rgba(184,121,31,.06)}
table.leads tbody tr.row-rejected{background:rgba(183,41,31,.045)}
table.leads tbody tr.row-rejected td:not(.td-status){opacity:.6}

table.leads td.td-num{
  font-family:var(--font-mono);font-size:.72rem;color:var(--muted);
  width:3rem;text-align:right;
}
table.leads td.td-name{font-weight:600;min-width:160px}
table.leads td.td-muted{
  font-family:var(--font-mono);font-size:.72rem;letter-spacing:.06em;
  color:var(--muted);white-space:nowrap;
}

.status-cell{
  display:inline-flex;align-items:center;gap:.35rem;
  padding:.35rem .75rem;border-radius:999px;
  border:1px solid var(--border);background:var(--surface);
  font-family:var(--font-body);font-size:.72rem;font-weight:600;
  letter-spacing:.02em;color:var(--muted);
  cursor:pointer;position:relative;
  transition:all .2s;
}
.status-cell:hover{border-color:var(--accent-light);color:var(--ink)}
.status-cell.s-accepted{background:var(--green);color:#fff;border-color:var(--green)}
.status-cell.s-maybe{background:var(--amber);color:#fff;border-color:var(--amber)}
.status-cell.s-rejected{background:var(--red);color:#fff;border-color:var(--red)}
.status-cell .caret{width:.55rem;height:.55rem;opacity:.7}

.status-popup{
  position:absolute;z-index:30;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  box-shadow:0 12px 30px -12px rgba(28,16,56,.3);
  padding:.35rem;display:flex;flex-direction:column;gap:.15rem;
  min-width:140px;
}
.status-popup button{
  padding:.55rem .75rem;border-radius:6px;text-align:left;
  font-size:.8rem;font-weight:600;color:var(--ink);
  transition:background-color .15s;
}
.status-popup button:hover{background:var(--bg)}
.status-popup button.p-accepted{color:var(--green)}
.status-popup button.p-maybe{color:var(--amber)}
.status-popup button.p-rejected{color:var(--red)}
.status-popup button.p-clear{color:var(--muted);font-style:italic}

.row-actions{
  display:inline-flex;gap:.4rem;align-items:center;
}
.row-action{
  display:inline-flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:8px;
  border:1px solid var(--border);background:var(--surface);
  color:var(--muted);
  transition:all .2s;
}
.row-action:hover{border-color:var(--accent-light);color:var(--ink)}
.row-action.a-wa:hover{background:var(--whatsapp);border-color:var(--whatsapp);color:#fff}
.row-action.a-mail:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.row-action .icon{width:.9rem;height:.9rem}

/* Empty / loading */
.empty{
  text-align:center;padding:5rem 2rem;
  background:var(--surface);border:1px dashed var(--border);
  border-radius:var(--radius);
}
.empty h2{
  font-family:var(--font-display);font-size:1.5rem;font-weight:700;
  letter-spacing:-.02em;color:var(--ink);margin-bottom:.5rem;
}
.empty p{color:var(--muted);font-size:.95rem}

.loading{
  text-align:center;padding:3rem 1rem;
  font-family:var(--font-mono);font-size:.7rem;
  letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
}

.load-more-wrap{text-align:center;padding:3rem 0 1rem}
.load-more-btn{
  padding:.9rem 2rem;border-radius:999px;
  background:var(--accent);color:#fff;border:1px solid var(--accent);
  font-family:var(--font-body);font-size:.78rem;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;
  transition:background-color .25s, transform .15s;
}
.load-more-btn:hover{background:var(--accent-deep)}
.load-more-btn:disabled{opacity:.55;cursor:not-allowed}

.toast{
  position:fixed;left:50%;bottom:calc(1.25rem + env(safe-area-inset-bottom, 0px));
  transform:translate(-50%, 140%);
  display:flex;align-items:center;gap:1rem;
  background:var(--ink);color:#fff;padding:.4rem .5rem .4rem 1rem;border-radius:12px;
  font-size:.85rem;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);
  transition:transform .3s cubic-bezier(.25,.46,.45,.94);z-index:999;
  max-width:calc(100vw - 2rem);
}
.toast.show{transform:translate(-50%, 0)}
.toast button{background:none;border:0;color:#CDB6F5;font-weight:700;font-size:.85rem;padding:.6rem .75rem}

.view-hidden{display:none !important}

@media(max-width:600px){
  .dash-top{padding:1rem 5vw}
  .dash-top-meta{gap:.75rem;font-size:.6rem}
  .dash-inner{padding:2rem 5vw 0}
  .stat-hero{margin-bottom:1.75rem}
  .card{padding:1.25rem 1.15rem 1.15rem}
  .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<!-- ============ LOGIN GATE ============ -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-brand">Start <em>with</em> Kunmi</div>
    <h1>Applications <em>access.</em></h1>
    <p class="gate-hint">Enter the team password to view submissions.</p>
    <form id="gateForm">
      <div class="gate-field">
        <input type="password" id="gateInput" placeholder="Password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="gate-submit" id="gateSubmit">
        <span id="gateBtnText">Enter</span>
        <svg class="icon" viewBox="0 0 24 24" style="width:1rem;height:1rem"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </button>
      <p class="gate-error" id="gateError"></p>
    </form>
    <p class="gate-foot">Private · Team only</p>
  </div>
</div>

<!-- ============ DASHBOARD ============ -->
<div class="dash" id="dash">
  <div class="dash-top">
    <div class="dash-top-brand">Start <em>with</em> Kunmi · Applications</div>
    <div class="dash-top-meta">
      <span><span class="live-dot"></span>Live</span>
      <span id="lastUpdate">—</span>
    </div>
    <div class="dash-top-actions">
      <a id="exportLink" href="#" class="export-btn" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v12M6 11l6 6 6-6M5 21h14"/></svg>
        Export CSV
      </a>
      <button id="logoutBtn">Log out</button>
    </div>
  </div>

  <div class="dash-inner">
    <div class="stat-hero">
      <div class="stat-num" id="countNum">0</div>
      <div class="stat-label">
        <strong>Applications received</strong>
        <span id="countSub">Loading…</span>
      </div>
    </div>

    <div class="controls">
      <div class="search-wrap">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>
        <input type="text" class="search-input" id="searchInput" placeholder="Search name, country, role…" autocomplete="off">
      </div>

      <div class="view-toggle" id="viewToggle" role="tablist">
        <button type="button" data-view="cards" class="is-active" id="vtCards">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Cards
        </button>
        <button type="button" data-view="table" id="vtTable">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 9h18M3 15h18M9 3v18M15 3v18M3 3h18v18H3z"/></svg>
          Table
        </button>
      </div>

      <div class="filter-pills" id="filterPills">
        <button class="pill is-active" data-filter="inbox">Inbox<span class="count" id="cInbox">—</span></button>
        <button class="pill" data-filter="accepted">Accepted<span class="count" id="cAccepted">—</span></button>
        <button class="pill" data-filter="maybe">Maybe<span class="count" id="cMaybe">—</span></button>
        <button class="pill" data-filter="rejected">Rejected<span class="count" id="cRejected">—</span></button>
      </div>
    </div>

    <!-- Cards view -->
    <div id="cardsView">
      <div class="grid" id="grid">
        <div class="loading" id="loading">Loading applications…</div>
      </div>
      <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
        <button class="load-more-btn" id="loadMoreBtn">Load more</button>
      </div>
    </div>

    <!-- Table view -->
    <div id="tableView" class="view-hidden">
      <div class="table-wrap">
        <div class="table-scroll">
          <table class="leads" id="leadsTable">
            <thead>
              <tr>
                <th data-sort="id">#<span class="sort-arrow">↓</span></th>
                <th data-sort="name">Name<span class="sort-arrow">↓</span></th>
                <th data-sort="age_range">Age<span class="sort-arrow">↓</span></th>
                <th data-sort="country">Country<span class="sort-arrow">↓</span></th>
                <th data-sort="role">Role<span class="sort-arrow">↓</span></th>
                <th data-sort="status">Status<span class="sort-arrow">↓</span></th>
                <th data-sort="submitted_at">Applied<span class="sort-arrow">↓</span></th>
                <th data-sort="submission_count">Times<span class="sort-arrow">↓</span></th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="leadsBody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastMsg"></span>
  <button type="button" id="toastUndo">Undo</button>
</div>

<script>
(function(){
  'use strict';

  var STORAGE_KEY = 'swk_admin_pw';
  var PAGE_SIZE = 20;

  var el = function(id){ return document.getElementById(id); };
  var gate = el('gate'), dash = el('dash');
  var gateForm = el('gateForm'), gateInput = el('gateInput');
  var gateError = el('gateError'), gateSubmit = el('gateSubmit'), gateBtnText = el('gateBtnText');
  var grid = el('grid'), countNum = el('countNum'), countSub = el('countSub');
  var lastUpdate = el('lastUpdate'), searchInput = el('searchInput');
  var filterPills = el('filterPills'), logoutBtn = el('logoutBtn');
  var toast = el('toast'), toastMsg = el('toastMsg'), toastUndo = el('toastUndo');
  var loadMoreWrap = el('loadMoreWrap'), loadMoreBtn = el('loadMoreBtn');
  var exportLink = el('exportLink');
  var cardsView = el('cardsView'), tableView = el('tableView');
  var viewToggle = el('viewToggle');
  var leadsBody = el('leadsBody');
  var leadsTable = el('leadsTable');
  var cInbox = el('cInbox'), cAccepted = el('cAccepted'), cMaybe = el('cMaybe'), cRejected = el('cRejected');

  var password = null;
  var allApps = [];
  var counts = { inbox:0, accepted:0, maybe:0, rejected:0, unseen:0, total:0 };
  var seenIds = new Set();
  var currentFilter = 'inbox';
  var currentView = 'cards';
  var currentQuery = '';
  var hasMore = false;
  var sortKey = 'id';
  var sortDir = 'desc';
  var pollTimer = null;
  var toastTimer = null;
  var lastUndo = null;

  // ================== auth ==================
  var saved = null;
  try { saved = sessionStorage.getItem(STORAGE_KEY); } catch(e){}
  if (saved) { password = saved; tryLoad(); }

  gateForm.addEventListener('submit', function(e){
    e.preventDefault();
    var val = gateInput.value.trim();
    if (!val) return;
    password = val;
    gateError.textContent = '';
    gateBtnText.textContent = 'Checking…';
    gateSubmit.disabled = true;
    tryLoad(true);
  });

  function buildUrl(offset){
    var u = '/api/submissions?view=' + encodeURIComponent(currentFilter) + '&limit=' + PAGE_SIZE + '&offset=' + (offset || 0);
    return u;
  }

  function tryLoad(fromGate){
    fetch(buildUrl(0), { headers: { 'x-admin-password': password } })
      .then(function(res){
        if (res.status === 401) throw new Error('wrong');
        if (!res.ok) throw new Error('fail');
        return res.json();
      })
      .then(function(data){
        try { sessionStorage.setItem(STORAGE_KEY, password); } catch(e){}
        gate.style.display = 'none';
        dash.classList.add('is-visible');
        exportLink.href = '/api/export?code=' + encodeURIComponent(password);
        allApps = data.applications || [];
        allApps.forEach(function(a){ seenIds.add(a.id); });
        counts = data.counts || counts;
        hasMore = !!data.hasMore;
        updateCounts();
        updateHeader();
        render();
        startPolling();
      })
      .catch(function(err){
        if (fromGate) {
          gateBtnText.textContent = 'Enter';
          gateSubmit.disabled = false;
          gateError.textContent = (err.message === 'wrong')
            ? 'Wrong password. Try again.'
            : 'Could not connect. Try again.';
          gateInput.value = '';
          gateInput.focus();
        } else {
          try { sessionStorage.removeItem(STORAGE_KEY); } catch(e){}
          password = null;
        }
      });
  }

  function startPolling(){
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(function(){
      if (currentView !== 'cards') return;
      fetch(buildUrl(0), { headers: { 'x-admin-password': password } })
        .then(function(res){ return res.ok ? res.json() : null; })
        .then(function(data){
          if (!data) return;
          var incoming = data.applications || [];
          var freshIds = new Set();
          incoming.forEach(function(a){ if (!seenIds.has(a.id)) freshIds.add(a.id); });
          // Merge: keep any older rows we've loaded, put new ones first
          var byId = {};
          allApps.forEach(function(a){ byId[a.id] = a; });
          var merged = incoming.slice();
          Object.keys(byId).forEach(function(k){
            var id = parseInt(k, 10);
            if (!incoming.some(function(a){ return a.id === id; })) merged.push(byId[k]);
          });
          merged.forEach(function(a){ if (freshIds.has(a.id)) a.__isNew = true; });
          allApps = merged;
          merged.forEach(function(a){ seenIds.add(a.id); });
          counts = data.counts || counts;
          updateCounts();
          updateHeader();
          render();
        })
        .catch(function(){});
    }, 30000);
  }

  function loadMore(){
    if (!hasMore) return;
    loadMoreBtn.disabled = true;
    loadMoreBtn.textContent = 'Loading…';
    fetch(buildUrl(allApps.length), { headers: { 'x-admin-password': password } })
      .then(function(res){ return res.ok ? res.json() : null; })
      .then(function(data){
        if (!data) return;
        var existingIds = new Set(allApps.map(function(a){ return a.id; }));
        (data.applications || []).forEach(function(a){
          if (!existingIds.has(a.id)) allApps.push(a);
          seenIds.add(a.id);
        });
        counts = data.counts || counts;
        hasMore = !!data.hasMore;
        updateCounts();
        updateHeader();
        render();
      })
      .catch(function(){})
      .then(function(){
        loadMoreBtn.disabled = false;
        loadMoreBtn.textContent = 'Load more';
      });
  }
  loadMoreBtn.addEventListener('click', loadMore);

  // ================== counts / header ==================
  function updateCounts(){
    cInbox.textContent = counts.inbox;
    cAccepted.textContent = counts.accepted;
    cMaybe.textContent = counts.maybe;
    cRejected.textContent = counts.rejected;
  }
  function updateHeader(){
    countNum.textContent = counts.total.toLocaleString();
    var label = counts.total === 0
      ? 'No applications yet'
      : (counts.total === 1 ? '1 person has applied' : counts.total + ' people have applied');
    if (counts.unseen > 0) label += ' · <span class="new-badge">' + counts.unseen + ' new</span>';
    countSub.innerHTML = label;
    var now = new Date();
    lastUpdate.textContent = 'Updated ' + now.toLocaleTimeString('en-NG', { hour:'2-digit', minute:'2-digit' });
  }

  // ================== filter / search / view ==================
  function matchesQuery(app){
    if (!currentQuery) return true;
    var q = currentQuery.toLowerCase();
    var hay = [app.name, app.country, app.role, app.what_building, app.current_challenge, app.final_response]
      .filter(Boolean).join(' ').toLowerCase();
    return hay.indexOf(q) !== -1;
  }

  function setFilter(next){
    if (next === currentFilter) return;
    currentFilter = next;
    filterPills.querySelectorAll('.pill').forEach(function(p){
      p.classList.toggle('is-active', p.getAttribute('data-filter') === next);
    });
    // Reload from server with new filter
    allApps = [];
    seenIds = new Set();
    fetch(buildUrl(0), { headers: { 'x-admin-password': password } })
      .then(function(res){ return res.ok ? res.json() : null; })
      .then(function(data){
        if (!data) return;
        allApps = data.applications || [];
        allApps.forEach(function(a){ seenIds.add(a.id); });
        counts = data.counts || counts;
        hasMore = !!data.hasMore;
        updateCounts();
        updateHeader();
        render();
      })
      .catch(function(){});
  }

  filterPills.addEventListener('click', function(e){
    var pill = e.target.closest('.pill');
    if (!pill) return;
    setFilter(pill.getAttribute('data-filter'));
  });

  viewToggle.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-view]');
    if (!btn) return;
    var next = btn.getAttribute('data-view');
    if (next === currentView) return;
    currentView = next;
    viewToggle.querySelectorAll('button').forEach(function(b){ b.classList.toggle('is-active', b === btn); });
    if (currentView === 'table') {
      cardsView.classList.add('view-hidden');
      tableView.classList.remove('view-hidden');
      loadTable();
    } else {
      tableView.classList.add('view-hidden');
      cardsView.classList.remove('view-hidden');
      render();
    }
  });

  var searchDebounce = null;
  searchInput.addEventListener('input', function(){
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(function(){
      currentQuery = searchInput.value.trim();
      if (currentView === 'table') loadTable();
      else render();
    }, 180);
  });

  // ================== cards view ==================
  function render(){
    if (currentView !== 'cards') return;
    var filtered = allApps.filter(matchesQuery);
    if (filtered.length === 0) {
      grid.innerHTML = '<div class="empty"><h2>' +
        (allApps.length === 0 ? 'Inbox is clear.' : 'Nothing matches.') +
        '</h2><p>' +
        (allApps.length === 0
          ? (currentFilter === 'inbox' ? 'Every application has been reviewed.' : 'No applications in this view yet.')
          : 'Try clearing your search.') +
        '</p></div>';
      loadMoreWrap.style.display = 'none';
      return;
    }

    var scrollY = window.scrollY;
    grid.innerHTML = filtered.map(renderCard).join('');
    window.scrollTo(0, scrollY);

    grid.querySelectorAll('.qa').forEach(function(qa){
      var body = qa.querySelector('.qa-body');
      var wordsEl = qa.querySelector('.qa-words');
      if (!body) return;
      var text = body.textContent.trim();
      var count = text.split(/\s+/).filter(Boolean).length;
      if (count < 8){
        wordsEl.textContent = 'Short answer · ' + count + (count === 1 ? ' word' : ' words');
        wordsEl.classList.add('is-short');
      }
      if (text.length > 170 && !qa.querySelector('.qa-toggle')){
        body.classList.add('clamped');
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'qa-toggle';
        btn.textContent = 'Read more';
        btn.addEventListener('click', function(){
          var clamped = body.classList.toggle('clamped');
          btn.textContent = clamped ? 'Read more' : 'Show less';
        });
        qa.appendChild(btn);
      }
    });

    grid.querySelectorAll('.card').forEach(function(card){
      var id = parseInt(card.getAttribute('data-id'), 10);

      card.querySelectorAll('.cta-wa, .cta-mail').forEach(function(a){
        a.addEventListener('click', function(){
          if (statusOf(card) !== 'accepted') {
            setStatus(card, 'accepted', true);
            var wasInbox = (currentFilter === 'inbox');
            if (wasInbox) {
              setTimeout(function(){ removeCardVisually(card); }, 60);
            }
          }
          card.classList.remove('is-unseen');
        });
      });

      var declineBtn = card.querySelector('.cta-decline');
      if (declineBtn) declineBtn.addEventListener('click', function(){
        if (currentFilter === 'inbox') {
          setTimeout(function(){ removeCardVisually(card); }, 60);
        }
      });

      card.querySelectorAll('.ghost').forEach(function(btn){
        btn.addEventListener('click', function(){
          var s = btn.getAttribute('data-status');
          var next = statusOf(card) === s ? null : s;
          setStatus(card, next, !!next);
          card.classList.remove('is-unseen');
          // If we're in Inbox and set to rejected, remove the card
          if (currentFilter === 'inbox' && next === 'rejected') {
            setTimeout(function(){ removeCardVisually(card); }, 60);
          }
        });
      });

      var undo = card.querySelector('.note-undo');
      if (undo) undo.addEventListener('click', function(){
        setStatus(card, null, false);
        // Reload so it comes back to Inbox
        if (currentFilter === 'inbox') setFilter('inbox');
      });

      card.addEventListener('click', function(e){
        if (e.target.closest('a, button')) return;
        if (card.classList.contains('is-unseen')) {
          card.classList.remove('is-unseen');
          markSeen(id);
        }
      });

      // Initial render state
      applyStatusClasses(card);
    });

    loadMoreWrap.style.display = hasMore ? 'block' : 'none';
  }

  function statusOf(card){
    if (card.classList.contains('is-accepted')) return 'accepted';
    if (card.classList.contains('is-maybe')) return 'maybe';
    if (card.classList.contains('is-rejected')) return 'rejected';
    return null;
  }

  function applyStatusClasses(card){
    var s = statusOf(card);
    var wa = card.querySelector('.cta-wa .cta-label');
    var mail = card.querySelector('.cta-mail .cta-label');
    var noteText = card.querySelector('.note-text');
    var accepted = s === 'accepted';
    if (wa) wa.textContent = accepted ? 'WhatsApp' : 'Accept and WhatsApp';
    if (mail) mail.textContent = accepted ? 'Email' : 'Accept and Email';
    if (noteText) noteText.textContent = s === 'accepted' ? 'Accepted' : (s === 'rejected' ? 'Rejected' : '');
    card.querySelectorAll('.ghost').forEach(function(g){
      g.classList.toggle('is-on-' + g.getAttribute('data-status'), g.getAttribute('data-status') === s);
    });
  }

  function setStatus(card, next, withToast){
    var id = parseInt(card.getAttribute('data-id'), 10);
    var prev = statusOf(card);
    ['accepted','maybe','rejected'].forEach(function(s){ card.classList.remove('is-' + s); });
    if (next) card.classList.add('is-' + next);
    applyStatusClasses(card);
    saveStatus(id, next);
    var app = allApps.find(function(a){ return a.id === id; });
    if (app) app.status = next;
    // Update counts client-side (optimistic)
    if (prev !== next) {
      if (prev) counts[prev] = Math.max(0, counts[prev] - 1);
      if (next) counts[next] = counts[next] + 1;
      // Inbox changes for accepted/rejected transitions
      if (prev === 'maybe' && next === null) counts.inbox += 1;
      if (prev === null && next === 'maybe') counts.inbox -= 1;
      if (prev === 'maybe' && (next === 'accepted' || next === 'rejected')) counts.inbox -= 1;
      if ((prev === 'accepted' || prev === 'rejected') && next === 'maybe') counts.inbox += 1;
      updateCounts();
    }
    if (withToast && next) showToast('Marked ' + next, function(){ setStatus(card, prev, false); });
    else hideToast();
  }

  function showToast(msg, undoFn){
    toastMsg.textContent = msg;
    toast.classList.add('show');
    lastUndo = undoFn;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 5000);
  }
  function hideToast(){
    toast.classList.remove('show');
    lastUndo = null;
    clearTimeout(toastTimer);
  }
  toastUndo.addEventListener('click', function(){
    if (lastUndo) lastUndo();
    hideToast();
  });

  function removeCardVisually(card){
    card.classList.add('is-removing');
    setTimeout(function(){
      card.remove();
      if (grid.children.length === 0) {
        grid.innerHTML = '<div class="empty"><h2>Inbox is clear.</h2><p>Every application has been reviewed.</p></div>';
      }
    }, 300);
  }

  function saveStatus(id, status){
    fetch('/api/status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': password },
      body: JSON.stringify({ id: id, status: status }),
    }).catch(function(){});
  }
  function markSeen(id){
    counts.unseen = Math.max(0, counts.unseen - 1);
    updateHeader();
    fetch('/api/seen', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': password },
      body: JSON.stringify({ id: id, seen: true }),
    }).catch(function(){});
  }

  function renderCard(app){
    var waNumber = sanitizeWA(app.whatsapp);
    var firstName = (app.name || '').split(' ')[0];
    var waMsg = "Hi " + firstName + ", this is Kunmi. Thanks for applying to Start With Kunmi — I'd love to talk more about what you're building.";
    var waHref = 'https://wa.me/' + waNumber + '?text=' + encodeURIComponent(waMsg);
    var emailSubject = 'Your application to Start With Kunmi';
    var emailBody = "Hi " + firstName + ",\n\nThank you for applying to Start With Kunmi. Your answers stood out, and I'd love to talk more about what you're working on.\n\nTalk soon,\nKunmi";
    var mailHref = 'mailto:' + encodeURIComponent(app.email) +
      '?subject=' + encodeURIComponent(emailSubject) +
      '&body=' + encodeURIComponent(emailBody);
    var declineHref = 'mailto:' + encodeURIComponent(app.email) +
      '?subject=' + encodeURIComponent('About your Start With Kunmi application') +
      '&body=' + encodeURIComponent("Hi " + firstName + ",\n\nThank you for applying to Start With Kunmi. We had a lot of strong applications this round, and we can't take everyone. We'd love to stay in touch for future cohorts.\n\nWishing you the best,\nKunmi");

    var date = '';
    if (app.last_submitted_at || app.submitted_at) {
      var d = new Date(app.last_submitted_at || app.submitted_at);
      date = d.toLocaleDateString('en-NG', { day:'numeric', month:'short' });
    }

    var cls = ['card'];
    if (!app.seen) cls.push('is-unseen');
    if (app.status) cls.push('is-' + app.status);

    var dupHtml = (app.submission_count && app.submission_count > 1)
      ? '<span class="dup-badge">Applied ' + app.submission_count + ' times</span>' : '';

    return '' +
      '<article class="' + cls.join(' ') + '" data-id="' + app.id + '">' +
        '<div class="card-head">' +
          '<div>' +
            '<div class="card-name-row">' +
              '<div class="card-name">' + esc(app.name) + '</div>' +
              '<span class="new-badge">New</span>' +
            '</div>' + dupHtml +
          '</div>' +
          '<div class="card-date">' + esc(date) + '</div>' +
        '</div>' +
        '<div class="tag-row">' +
          (app.country ? '<span class="tag accent">' + esc(app.country) + '</span>' : '') +
          (app.age_range ? '<span class="tag">' + esc(app.age_range) + '</span>' : '') +
          (app.role ? '<span class="tag">' + esc(app.role) + '</span>' : '') +
        '</div>' +
        '<div class="card-answers">' +
          qa('Working on', app.what_building) +
          qa('Stuck on', app.current_challenge) +
          qa('Wants to leave with', app.final_response) +
        '</div>' +
        '<div class="status-note"><span class="note-text"></span><button class="note-undo" type="button">Undo</button></div>' +
        '<div class="secondary-row">' +
          '<button class="ghost" type="button" data-status="maybe">Maybe</button>' +
          '<button class="ghost" type="button" data-status="rejected">No</button>' +
        '</div>' +
        '<div class="cta-row">' +
          '<a class="cta cta-wa" href="' + waHref + '" target="_blank" rel="noopener">' +
            '<svg class="icon" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>' +
            '<span class="cta-label">Accept and WhatsApp</span>' +
          '</a>' +
          '<a class="cta cta-mail" href="' + mailHref + '">' +
            '<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>' +
            '<span class="cta-label">Accept and Email</span>' +
          '</a>' +
          '<a class="cta cta-decline" href="' + declineHref + '">Send decline</a>' +
        '</div>' +
      '</article>';
  }

  function qa(label, value){
    if (!value) return '';
    var text = String(value);
    var words = text.trim().split(/\s+/).filter(Boolean).length;
    var long = text.length > 170;
    return '' +
      '<div class="qa">' +
        '<div class="qa-label"><span>' + esc(label) + '</span><span class="qa-words">' + words + ' word' + (words === 1 ? '' : 's') + '</span></div>' +
        '<div class="qa-body' + (long ? ' clamped' : '') + '">' + esc(text) + '</div>' +
        (long ? '<button type="button" class="qa-toggle">Read more</button>' : '') +
      '</div>';
  }

  // ================== table view ==================
  function loadTable(){
    fetch('/api/submissions?view=' + encodeURIComponent(currentFilter) + '&view2=table', { headers: { 'x-admin-password': password } })
      .catch(function(){ return null; })
      .then(function(){
        // Request the actual table payload
        return fetch('/api/submissions?view=table', { headers: { 'x-admin-password': password } });
      })
      .then(function(res){ return res.ok ? res.json() : null; })
      .then(function(data){
        if (!data) return;
        counts = data.counts || counts;
        updateCounts();
        var rows = (data.applications || []).filter(function(a){
          // Apply filter client-side for table view (tab)
          if (currentFilter === 'inbox') return !a.status || a.status === 'maybe';
          return a.status === currentFilter;
        }).filter(matchesQuery);
        renderTable(rows);
      })
      .catch(function(){});
  }

  function renderTable(rows){
    // Sort
    rows.sort(function(a, b){
      var av = a[sortKey], bv = b[sortKey];
      if (av == null) av = '';
      if (bv == null) bv = '';
      if (typeof av === 'string') av = av.toLowerCase();
      if (typeof bv === 'string') bv = bv.toLowerCase();
      if (av < bv) return sortDir === 'asc' ? -1 : 1;
      if (av > bv) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });

    // Update header arrows
    leadsTable.querySelectorAll('th[data-sort]').forEach(function(th){
      th.classList.toggle('is-sorted', th.getAttribute('data-sort') === sortKey);
    });

    if (rows.length === 0) {
      leadsBody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:4rem 1rem;color:var(--muted);font-family:var(--font-mono);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase">No leads in this view</td></tr>';
      return;
    }

    leadsBody.innerHTML = rows.map(function(app, i){
      var rowCls = '';
      if (app.status === 'accepted') rowCls = 'row-accepted';
      else if (app.status === 'maybe') rowCls = 'row-maybe';
      else if (app.status === 'rejected') rowCls = 'row-rejected';

      var statusCls = '';
      var statusText = 'Not reviewed';
      if (app.status === 'accepted') { statusCls = 's-accepted'; statusText = 'Accepted'; }
      if (app.status === 'maybe') { statusCls = 's-maybe'; statusText = 'Maybe'; }
      if (app.status === 'rejected') { statusCls = 's-rejected'; statusText = 'Rejected'; }

      var appliedDate = '';
      if (app.last_submitted_at || app.submitted_at) {
        var d = new Date(app.last_submitted_at || app.submitted_at);
        appliedDate = d.toLocaleDateString('en-NG', { day:'numeric', month:'short', year:'2-digit' });
      }

      var times = (app.submission_count && app.submission_count > 1) ? app.submission_count + '×' : '';

      var waNumber = sanitizeWA(app.whatsapp);
      var firstName = (app.name || '').split(' ')[0];
      var waMsg = "Hi " + firstName + ", this is Kunmi. Thanks for applying to Start With Kunmi — I'd love to talk more about what you're building.";
      var waHref = 'https://wa.me/' + waNumber + '?text=' + encodeURIComponent(waMsg);
      var mailHref = 'mailto:' + encodeURIComponent(app.email);

      return '' +
        '<tr class="' + rowCls + '" data-id="' + app.id + '">' +
          '<td class="td-num">' + (i + 1) + '</td>' +
          '<td class="td-name">' + esc(app.name) + '</td>' +
          '<td class="td-muted">' + esc(app.age_range || '—') + '</td>' +
          '<td>' + esc(app.country || '—') + '</td>' +
          '<td>' + esc(app.role || '—') + '</td>' +
          '<td class="td-status">' +
            '<button class="status-cell ' + statusCls + '" type="button" data-id="' + app.id + '">' + statusText + '</button>' +
          '</td>' +
          '<td class="td-muted">' + esc(appliedDate) + '</td>' +
          '<td class="td-muted">' + esc(times) + '</td>' +
          '<td>' +
            '<div class="row-actions">' +
              '<a class="row-action a-wa" href="' + waHref + '" target="_blank" rel="noopener" title="WhatsApp">' +
                '<svg class="icon" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>' +
              '</a>' +
              '<a class="row-action a-mail" href="' + mailHref + '" title="Email">' +
                '<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>' +
              '</a>' +
            '</div>' +
          '</td>' +
        '</tr>';
    }).join('');

    // Wire status cells
    leadsBody.querySelectorAll('.status-cell').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        openStatusPopup(btn, parseInt(btn.getAttribute('data-id'), 10));
      });
    });
  }

  var openPopup = null;
  function openStatusPopup(anchorBtn, id){
    closePopup();
    var rect = anchorBtn.getBoundingClientRect();
    var popup = document.createElement('div');
    popup.className = 'status-popup';
    popup.innerHTML =
      '<button class="p-accepted" data-set="accepted">Accept</button>' +
      '<button class="p-maybe" data-set="maybe">Maybe</button>' +
      '<button class="p-rejected" data-set="rejected">No</button>' +
      '<button class="p-clear" data-set="">Clear</button>';
    document.body.appendChild(popup);
    popup.style.top = (rect.bottom + window.scrollY + 6) + 'px';
    popup.style.left = (rect.left + window.scrollX) + 'px';
    openPopup = popup;

    popup.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){
        var s = b.getAttribute('data-set') || null;
        saveStatus(id, s);
        // Update DOM immediately
        var tr = leadsBody.querySelector('tr[data-id="' + id + '"]');
        if (tr) {
          tr.classList.remove('row-accepted','row-maybe','row-rejected');
          if (s) tr.classList.add('row-' + s);
          var cell = tr.querySelector('.status-cell');
          if (cell) {
            cell.classList.remove('s-accepted','s-maybe','s-rejected');
            if (s) cell.classList.add('s-' + s);
            cell.textContent = s ? s.charAt(0).toUpperCase() + s.slice(1) : 'Not reviewed';
          }
        }
        // Refresh counts from server silently
        fetch('/api/submissions?view=' + encodeURIComponent(currentFilter) + '&limit=1', { headers: { 'x-admin-password': password } })
          .then(function(r){ return r.ok ? r.json() : null; })
          .then(function(d){ if (d && d.counts) { counts = d.counts; updateCounts(); updateHeader(); } })
          .catch(function(){});
        closePopup();
      });
    });

    setTimeout(function(){
      document.addEventListener('click', onDocClickPopup, { once: true });
    }, 0);
  }
  function onDocClickPopup(e){
    if (openPopup && !openPopup.contains(e.target)) closePopup();
  }
  function closePopup(){
    if (openPopup) { openPopup.remove(); openPopup = null; }
  }

  leadsTable.querySelectorAll('th[data-sort]').forEach(function(th){
    th.addEventListener('click', function(){
      var k = th.getAttribute('data-sort');
      if (k === sortKey) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      else { sortKey = k; sortDir = 'asc'; }
      loadTable();
    });
  });

  // ================== helpers ==================
  function sanitizeWA(num){
    if (!num) return '';
    var digits = String(num).replace(/\D/g, '');
    if (digits.length === 11 && digits.charAt(0) === '0') digits = '234' + digits.slice(1);
    else if (digits.length === 10) digits = '234' + digits;
    return digits;
  }
  function esc(s){
    if (s === null || s === undefined) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  logoutBtn.addEventListener('click', function(){
    try { sessionStorage.removeItem(STORAGE_KEY); } catch(e){}
    password = null;
    if (pollTimer) clearInterval(pollTimer);
    dash.classList.remove('is-visible');
    gate.style.display = 'flex';
    gateInput.value = '';
    gateError.textContent = '';
    gateBtnText.textContent = 'Enter';
    gateSubmit.disabled = false;
    gateInput.focus();
  });

})();
</script>
</body>
</html>
